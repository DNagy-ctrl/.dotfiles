# True color support (Modern tmux 3.2+)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Enable mouse support (optional but recommended)
set -g mouse on

# Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start window and pane indexing at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Shift + Alt to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Pane resize keybindings (Ctrl + Alt + hjkl or Ctrl + Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run "~/.tmux/plugins/tpm/tpm" 

# --- Window / tab appearance ---
set -g status-left "  #S  "
set -g status-left-length 30
# Show window number + window name
set -g window-status-format "#[fg=#7f849c] #I:#W "
set -g window-status-current-format "#[fg=#c6a0f6,bold] #I:#W "
# Automatically name windows after the running program
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"
