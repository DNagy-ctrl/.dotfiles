# https://wiki.hyprland.org/Configuring/

################
### MONITORS ###
################
monitor=eDP-1,preferred,0x1080,1
monitor=DP-5,preferred,0x0,1,transform,2
monitor= DP-3, preferred, 1920x1080, 1
monitor= VGA-1, preferred, 1920x1080, 1
#################
### AUTOSTART ###
#################
exec-once = waybar & hyprpaper & dunst
exec-once = java -jar ~/.dotfiles/hypr/oneko-2.0.1.jar

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

env = BROWSER, firefox
#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 0#2
    gaps_out = 0#4
    border_size = 2
    col.active_border = rgba(ffffffff) 
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
     enabled = false
    }
    blur {
     enabled = false
    }
}
animations {
 enabled = no
}
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}
master {
    new_status = master
}
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model = 
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}
gestures {
    workspace_swipe = false
}
device {
    name = epic-mouse-v1
    sensitivity = -0.2
}


###################
### KEYBINDINGS ###
###################

# Variables
$mainMod = SUPER 
$enter = code:36

# Window
bind = $mainMod, F, togglefloating
 # splitting windows
 # resizing winow with keyboard

# Keybinds
bind = $mainMod, $enter, exec, alacritty
bind = $mainMod ALT, $enter, exec, firefox
bind = $mainMod, Q, killactive
bind = $mainMod ALT CTRL, Q, exit
bind = $mainMod ALT CTRL, H, exec, systemctl hibernate 
bind = $mainMod, D, togglesplit, # dwindle
bind = $mainMod, S, exec, fuzzel

# Focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Resizing
binde = $mainMod ALT, H, resizeactive, -10 0
binde = $mainMod ALT, L, resizeactive, 10 0
binde = $mainMod ALT, J, resizeactive, 0 10
binde = $mainMod ALT, K, resizeactive, 0 -10
binde = $mainMod ALT SHIFT, H, resizeactive, -1 0
binde = $mainMod ALT SHIFT, L, resizeactive, 1 0
binde = $mainMod ALT SHIFT, J, resizeactive, 0 1
binde = $mainMod ALT SHIFT, K, resizeactive, 0 -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+ #-e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- #-e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screen shots
bind = $mainMod, P, exec, grim
bind = $mainMod ALT, P, exec, grim -g "$(slurp)"

# Toggle trackpad
bind = SUPER, M, exec, zsh -x ~/.dotfiles/scripts/toggleTouchpad.sh

# Compose key
input {
    kb_options = compose:caps
}
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
